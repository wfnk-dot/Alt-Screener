# =====================================================================
#  Alt Screener settings
#  Edit this file on the GitHub website (pencil icon), then "Commit changes".
#  Lines starting with # are notes and are ignored.
#  Keep the indentation (spaces at the start of lines) exactly as it is.
# =====================================================================

# ---------------------------------------------------------------------
#  When to post (UK time, handles GMT/BST automatically)
# ---------------------------------------------------------------------
schedule:
  # Day of the week to post: Monday, Tuesday, ... Sunday
  day: Sunday
  # Time to post, 24-hour clock, UK time. GitHub's timer checks once an hour,
  # and is often 5-30 minutes late, so the post lands shortly after this.
  time: "18:00"
  # Time zone. Leave as Europe/London.
  timezone: Europe/London
  # Mid-week movers: on these days the screener runs again and pings the watchlist channel
  # if a coin has jumped into the top 10 since Sunday's list (silent if nothing changed).
  # Use [] to switch it off, or add days, e.g. [Tuesday, Thursday].
  midweek_days: [Wednesday]
  midweek_time: "18:00"

# ---------------------------------------------------------------------
#  Discord post
# ---------------------------------------------------------------------
discord:
  # Who to ping at the top of the post: "@here", "@everyone", or "" for no ping
  ping: "@here"

# ---------------------------------------------------------------------
#  The table picture in the Discord post
# ---------------------------------------------------------------------
table:
  # Columns, left to right. Delete a line to hide a column, or move lines to reorder.
  # Available:
  #   rank             position on the list
  #   coin             coin name
  #   trend_weekly     Up / Down / Range on the weekly chart
  #   trend_daily      Up / Down / Range on the daily chart
  #   trend_4h         Up / Down / Range on the 4-hour chart (live)
  #   trend_1h         Up / Down / Range on the 1-hour chart (live; goes stale fastest)
  #   atr              ATR(14) as % of price = average daily move
  #   price_7d         price change over the last 7 days (live, includes the weekend)
  #   price_weekend    price change over Saturday + Sunday (Friday close to Sunday close, or to now)
  #   oi_3d            open interest change over 3 days
  #   oi_7d            open interest change over 7 days
  #   rsi_weekly       weekly RSI(14)
  #   rsi_range        lowest and highest weekly RSI over the last 12 weeks, e.g. 47–71
  #                    (low ~45-50 = healthy resets; low in the 30s = it broke down)
  #   funding          current funding per 8 hours (yellow if extreme)
  #   oi_size          open interest in dollars
  #   volume_ratio     last 7 days' volume vs the 30-day average (above 1 = rising interest)
  #   corr_btc         correlation with BTC: 1 = copies BTC, 0 = does its own thing, below 0 = opposite
  #   beta_btc         how hard it moves vs BTC: 2x = about 2% for every 1% BTC move
  #   score            the ranking score (0-100)
  columns:
    - rank
    - coin
    - trend_1h
    - trend_4h
    - trend_daily
    - trend_weekly
    - atr
    - price_7d
    - price_weekend
    - oi_3d
    - oi_7d
    - rsi_weekly
    - rsi_range
    - corr_btc
    - beta_btc

# ---------------------------------------------------------------------
#  BTC (shown at the top of the post, and used for correlation/beta)
# ---------------------------------------------------------------------
btc:
  binance_symbol: BTCUSDT
  hyperliquid_coin: BTC

# ---------------------------------------------------------------------
#  How many coins go on the watchlist
# ---------------------------------------------------------------------
top_n: 10

# ---------------------------------------------------------------------
#  Filters: a coin must pass ALL of these to be considered
# ---------------------------------------------------------------------
filters:
  # Binance: average daily trading volume over the last 7 days, in US dollars
  binance_min_avg_daily_volume_7d: 30000000      # $30M
  # Binance: open interest (value of open positions), in US dollars
  binance_min_open_interest: 15000000            # $15M
  # Hyperliquid: 24-hour trading volume, in US dollars
  hyperliquid_min_volume_24h: 3000000            # $3M
  # Hyperliquid: open interest, in US dollars
  hyperliquid_min_open_interest: 3000000         # $3M
  # Movement: daily ATR(14) as a % of price. 4 means the coin moves 4% a day on average
  min_atr_pct: 4
  # Brand-new coins with fewer than this many daily candles skip the ATR test
  # (there isn't enough history to measure it). Volume and OI tests still apply.
  min_days_for_atr_filter: 15

# ---------------------------------------------------------------------
#  Ranking: how "most active" is scored. Weights should add up to 100.
#  Each metric is turned into a 0-100% rank among the coins that passed
#  the filters, multiplied by its weight, and summed.
# ---------------------------------------------------------------------
ranking_weights:
  atr_pct: 30            # daily ATR(14) as % of price
  volume_ratio: 25       # 7-day avg volume / 30-day avg volume (rising interest)
  oi_change_abs: 20      # open interest change over 7 days, either direction
  return_7d_abs: 15      # 7-day price move, either direction
  oi_size: 10            # Binance open interest size (deeper market)

# ---------------------------------------------------------------------
#  Indicator settings
# ---------------------------------------------------------------------
indicators:
  atr_period: 14
  rsi_period: 14
  # How many recent weeks the RSI low–high range covers
  rsi_lookback_weeks: 12
  # Shading of the RSI low–high cell: green if the lowest weekly RSI stayed at or
  # above this (dips held), red if the highest never got above the next one (never strong)
  rsi_range_strong_low: 45
  rsi_range_weak_high: 55
  # Trend bands (same as the XO Bands indicator: green when fast EMA is above slow EMA)
  ema_fast: 12
  ema_slow: 25
  # Trend = Up (or Down) when the bands are green (red) AND:
  #   - they flipped colour at most this many times in the last N candles
  trend_flip_lookback: 30
  trend_max_flips: 1
  #   - they're open: the gap between the EMAs is at least this many ATRs
  #     (flat or squeezed bands = stalling = Range)
  trend_min_gap_atr: 0.3
  # Anything else is Range (flip-flopping, flat bands, or a fresh flip still opening up)
  # How many 4h / 1h candles to load for those trends
  intraday_candles: 200
  # Volume ratio: compares the last 7 days to the last 30 days
  volume_short_days: 7
  volume_long_days: 30
  # Days used for the "7d move" and "OI 7d change"
  change_days: 7
  # Days used for the shorter "OI 3 days" change
  oi_short_change_days: 3
  # Days of daily moves used for correlation and beta vs BTC
  beta_corr_days: 30
  # Fewer than this many weekly candles = "New listing" tag
  new_listing_min_weeks: 26
  # Funding rate (per 8 hours, in %) at or beyond which it's flagged as extreme
  funding_extreme_pct: 0.05

# ---------------------------------------------------------------------
#  Which coins to look at
# ---------------------------------------------------------------------
universe:
  # Only Binance perpetuals quoted in this currency
  quote_asset: USDT
  # Coins never put on the alts list. Matched on the coin name
  # (e.g. "PEPE" also covers Binance "1000PEPEUSDT").
  exclude:
    # Fixed core list (always on the watchlist, see "core" below)
    core: [BTC, ETH, SOL, HYPE]
    # Gold and other metals
    gold: [XAU, XAG, PAXG, XAUT, XPT, XPD]
    # Stablecoins
    stablecoins: [USDC, USDT, FDUSD, TUSD, USDP, BUSD, DAI, USDE, USD1, PYUSD, RLUSD, USDS, SUSD, EUR, EURC, USTC, UST]
    # Dominance / index contracts
    indexes: [BTCDOM, DEFI, FOOTBALL, BLUEBIRD, ALLINDEX, ALL]
    # Tokenised stocks and tradfi (oil, indices, FX)
    tradfi: [TSLA, NVDA, AAPL, MSFT, AMZN, GOOGL, META, COIN, MSTR, HOOD, CRCL, SPY, QQQ, NFLX, AMD, PLTR, INTC, BZ, CL, WTI, BRENT, NATGAS, SPX500, NAS100, US500, US30, JPY, GBP, AUD, CAD, CHF]
  # Contracts whose last daily candle is older than this many days are
  # treated as delisted/settled and skipped
  max_days_since_last_candle: 3
  # Manual name matches for Binance coin -> Hyperliquid coin, for names
  # the automatic matching misses. Format:  BINANCE_NAME: HYPERLIQUID_NAME
  # (Automatic: "1000PEPE" <-> "kPEPE", "1000000MOG" <-> "MOG", etc.)
  hyperliquid_aliases:
    1000PEPE: kPEPE
    1000BONK: kBONK
    1000SHIB: kSHIB
    1000FLOKI: kFLOKI
    1000LUNC: kLUNC
    1000SATS: kSATS
    1000CAT: kCAT
    1000CHEEMS: kCHEEMS
    1000000MOG: MOG
    1000000BOB: BOB
    1MBABYDOGE: kBABYDOGE
    NEIRO: kNEIRO
    DOGS: kDOGS
    LUNA2: LUNA

# ---------------------------------------------------------------------
#  Dorito alerts (Leledc exhaustion, "Exhaustion levels (InSilico)")
#  Checked every hour; an alert only goes out once the candle has CLOSED.
# ---------------------------------------------------------------------
alerts:
  # Timeframes to watch: 4h, 1d (daily), 3d (3-day), 1w (weekly)
  timeframes: [4h, 1d, 3d, 1w]
  # How many coins: the top N by Hyperliquid 24h volume
  top_n: 50
  # Skip these groups from the exclude lists under "universe" (core coins are NOT skipped)
  exclude_groups: [stablecoins, indexes, tradfi]
  # Same settings as the indicator: "Exhaustion bar count" and "Exhaustions swing length"
  leledc_bar_count: 10
  leledc_swing_length: 40
  # Who to ping: "@here", "@everyone", or "" for none
  ping: "@here"
  # Candles: Binance's live futures data (same as your TradingView chart). Hyperliquid is the backup.
  binance_web_url: https://www.binance.com
  # Pause between Binance requests (stays well under Binance's per-minute limit)
  binance_seconds_between_calls: 0.4

# ---------------------------------------------------------------------
#  Catalysts channel: week ahead, past BTC reactions, and reminders
# ---------------------------------------------------------------------
events:
  # Week-ahead post (UK time)
  outlook_day: Sunday
  outlook_time: "17:30"
  # Reminders before each event, in minutes (1440 = 1 day)
  reminders_minutes: [1440, 60, 15]
  # Who to ping: "@here", "@everyone", or "" for none
  ping: "@here"
  # Which news: high-importance US events from TradingView's economic calendar whose name contains
  # one of these (anything else, like housing data, is left out)
  include:
    - Fed Interest Rate Decision
    - Fed Press Conference
    - FOMC Minutes
    - Inflation Rate MoM
    - Non Farm Payrolls
    - Core PCE Price Index MoM
    - PPI MoM
    - Retail Sales MoM
    - GDP Growth Rate
    - ISM Manufacturing PMI
    - ISM Services PMI
    - JOLTs Job Openings
    - Fed Chair
    - President Trump
  # ...but never these
  skip: [Annual Revision]
  # Earnings: only these companies (ticker: name). Add e.g. COIN: Coinbase, MSTR: Strategy
  earnings_companies:
    NVDA: Nvidia
    AAPL: Apple
    MSFT: Microsoft
    GOOGL: Alphabet (Google)
    AMZN: Amazon
    META: Meta
    TSLA: Tesla
    AVGO: Broadcom
    AMD: AMD
  # Event names that count as the same thing. They're merged into one row and their BTC reaction
  # history is tracked. (Names from TradingView and, as backup, Forex Factory.)
  groups:
    FOMC: ["Fed Interest Rate Decision", "Fed Press Conference", "FOMC Statement",
           "Federal Funds Rate", "FOMC Press Conference"]
    CPI: ["Inflation Rate MoM", "Core Inflation Rate MoM", "CPI m/m", "Core CPI m/m", "CPI y/y"]
    Jobs report (NFP): ["Non Farm Payrolls", "Non-Farm Employment Change", "Unemployment Rate"]
    PCE: ["Core PCE Price Index MoM", "Core PCE Price Index m/m"]
    GDP: ["GDP Growth Rate QoQ Adv", "GDP Growth Rate QoQ 2nd Est", "GDP Growth Rate QoQ Final",
          "GDP Growth Rate QoQ", "Advance GDP q/q", "Prelim GDP q/q", "Final GDP q/q"]
    PPI: ["PPI MoM", "PPI m/m", "Core PPI m/m"]
    Retail sales: ["Retail Sales MoM", "Retail Sales m/m", "Core Retail Sales m/m"]
  # Which of those get the "How BTC reacted last times" table, and how many past times to show.
  # Past dates are in events_history.json (a year of them was filled in from TradingView's
  # economic calendar); new ones are added automatically as they happen.
  history_groups: [FOMC, CPI, Jobs report (NFP), PCE, PPI, Retail sales, GDP]
  history_count: 9
  # Sources (normally no need to change). Forex Factory is the backup if TradingView fails.
  tv_calendar_url: https://economic-calendar.tradingview.com/events
  tv_countries: [US]
  calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  countries: [USD]
  impacts: [High]
  fomc_calendar_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  earnings_url: https://api.nasdaq.com/api/calendar/earnings
  # The 1-hour and 15-minute reminders: a run this many minutes early waits for the right moment
  reminder_wait_minutes: 75

# ---------------------------------------------------------------------
#  TradingView watchlist file
# ---------------------------------------------------------------------
tradingview:
  # Name of the first section and its fixed symbols (always included)
  core_section: CORE
  core:
    - BINANCE:BTCUSDT.P
    - BINANCE:ETHUSDT.P
    - BINANCE:SOLUSDT.P
    - BINANCE:HYPEUSDT.P
    - OANDA:XAUUSD
  # Name of the section holding this week's alts
  alts_section: ALTS
  # How each alt is written. {symbol} becomes e.g. 1000PEPEUSDT
  alt_symbol_format: "BINANCE:{symbol}.P"

# ---------------------------------------------------------------------
#  Data sources (normally no need to change)
# ---------------------------------------------------------------------
data:
  # Binance public data archive
  binance_archive_url: https://data.binance.vision
  # Binance live data. www.binance.com answers from GitHub's US servers (fapi.binance.com doesn't).
  # If it ever stops working, the archive and Hyperliquid are used instead automatically.
  binance_api_url: https://www.binance.com
  # Pause between Binance requests (stays well under Binance's per-minute limit)
  binance_seconds_between_calls: 0.25
  # Hyperliquid public API
  hyperliquid_url: https://api.hyperliquid.xyz/info
  # Bybit public API (backup for Binance candles)
  bybit_url: https://api.bybit.com
  # Months of daily candles to download for each coin (for weekly trend/RSI)
  history_months: 18
  # Pause between Hyperliquid requests (it allows a limited number per minute)
  hyperliquid_seconds_between_calls: 1.2
  # How many downloads to run at once
  parallel_downloads: 16
  # Seconds to wait for each web request
  timeout_seconds: 30

# ---------------------------------------------------------------------
#  Output
# ---------------------------------------------------------------------
output:
  # How many past weekly lists to keep in state.json
  keep_weeks: 8
