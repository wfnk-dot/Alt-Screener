name: Dorito Alerts

on:
  # Every hour, just after candles close. Each timeframe is only checked when a new candle has closed.
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show alerts in the log only, don't post or save"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alt-screener
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check for Doritos
        env:
          DISCORD_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m screener.alerts --dry-run
          else
            python -m screener.alerts
          fi

      - name: Save what was checked
        if: inputs.dry_run != true
        run: |
          git config user.name "alt-screener bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts_state.json
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Dorito alerts checked $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
